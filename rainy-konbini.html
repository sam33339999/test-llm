<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>雨夜便利店街角</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#090c1e;}
  canvas{display:block;touch-action:none;outline:none;cursor:grab}
  canvas:active{cursor:grabbing}
  #vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 52%,rgba(3,3,14,.62) 100%);}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="vignette"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* =========================================================
   基礎設定
   ========================================================= */
const W = () => window.innerWidth, H = () => window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, W() / H(), 0.1, 400);
const camDist = W() / H() < 0.8 ? 74 : 48;
camera.position.set(0.5, 0.42, 0.78).normalize().multiplyScalar(camDist);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.5, 1.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 10;
controls.maxDistance = 110;
controls.maxPolarAngle = Math.PI * 0.47;
controls.rotateSpeed = 0.7;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.18;
let idleTimer = null;
controls.addEventListener('start', () => { controls.autoRotate = false; clearTimeout(idleTimer); });
controls.addEventListener('end', () => { clearTimeout(idleTimer); idleTimer = setTimeout(() => controls.autoRotate = true, 12000); });
controls.addEventListener('change', () => {
  controls.target.x = THREE.MathUtils.clamp(controls.target.x, -12, 12);
  controls.target.z = THREE.MathUtils.clamp(controls.target.z, -12, 12);
  controls.target.y = THREE.MathUtils.clamp(controls.target.y, -1, 8);
});

const JP = '"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Noto Sans CJK JP","Yu Gothic","Meiryo","Microsoft JhengHei",sans-serif';

/* 背景漸層 */
scene.background = canvasTex(4, 512, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#05081a'); gr.addColorStop(.45, '#101634'); gr.addColorStop(.8, '#221d46'); gr.addColorStop(1, '#2d2350');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
scene.fog = new THREE.Fog(0x161b3c, 70, 170);

/* 燈光：冷色夜空 */
scene.add(new THREE.HemisphereLight(0x6b7cc4, 0x231d3c, 1.35));
const moon = new THREE.DirectionalLight(0xa8b8ff, 0.9);
moon.position.set(-12, 30, 14);
scene.add(moon);

/* =========================================================
   工具函數
   ========================================================= */
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); g.fill(); }
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
let seed = 7;
const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* 三渲二色階 */
const gradientMap = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 165, 165, 165, 255, 255, 255, 255, 255]), 3, 1);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
gradientMap.needsUpdate = true;

const matCache = new Map();
function toon(color, o = {}) {
  const key = color + JSON.stringify(o, (k, v) => (v && v.isTexture) ? v.uuid : v);
  if (matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({ color, gradientMap, ...o });
  matCache.set(key, m); return m;
}
/* 室內材質：自帶暖色自發光，保證店內明亮 */
const inToon = (c, e = 0x4a3b28) => toon(c, { emissive: e });
function glow(color, k = 1.6, o = {}) {
  return new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(k), ...o });
}

const root = new THREE.Group(); scene.add(root);
const geoCache = new Map();
function BG(w, h, d) {
  const k = `b${w.toFixed(3)}_${h.toFixed(3)}_${d.toFixed(3)}`;
  if (!geoCache.has(k)) geoCache.set(k, new THREE.BoxGeometry(w, h, d));
  return geoCache.get(k);
}
function put(m, o = {}) {
  (o.parent || root).add(m);
  m.userData.ol = o.ol !== false;
  if (o.th) m.userData.th = o.th;
  return m;
}
/* box：y 為底面高度 */
function box(w, h, d, mat, x, y, z, o = {}) {
  const m = new THREE.Mesh(BG(w, h, d), mat);
  m.position.set(x, y + h / 2, z);
  if (o.ry) m.rotation.y = o.ry;
  return put(m, o);
}
/* 依邊界建立 box */
function boxR(x0, x1, y0, y1, z0, z1, mat, o = {}) {
  return box(x1 - x0, y1 - y0, z1 - z0, mat, (x0 + x1) / 2, y0, (z0 + z1) / 2, o);
}
function cyl(rt, rb, h, mat, x, y, z, o = {}) {
  const seg = o.seg || 16;
  const k = `c${rt}_${rb}_${h}_${seg}`;
  if (!geoCache.has(k)) geoCache.set(k, new THREE.CylinderGeometry(rt, rb, h, seg));
  const m = new THREE.Mesh(geoCache.get(k), mat);
  m.position.set(x, y + h / 2, z);
  return put(m, { th: 40, ...o });
}
const _up = new THREE.Vector3(0, 1, 0);
function rod(a, b, r, mat, o = {}) {
  const d = new THREE.Vector3().subVectors(b, a);
  const len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, o.seg || 8), mat);
  m.position.copy(a).add(b).multiplyScalar(0.5);
  m.quaternion.setFromUnitVectors(_up, d.normalize());
  return put(m, { ol: false, ...o });
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);
/* 平面：預設朝 +z */
function plane(w, h, mat, x, y, z, ry = 0, o = {}) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  m.position.set(x, y, z); m.rotation.y = ry;
  return put(m, { ol: false, ...o });
}
function flat(w, d, mat, x, y, z, o = {}) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
  m.rotation.x = -Math.PI / 2; m.position.set(x, y, z);
  if (o.rz) m.rotation.z = o.rz;
  return put(m, { ol: false, ...o });
}

/* 輪廓線材質 */
const lineMats = [];
function makeLineMat(color = 0x15112b, width = 1.5) {
  const m = new LineMaterial({ color, linewidth: width, resolution: new THREE.Vector2(W(), H()) });
  m.fog = true; lineMats.push(m); return m;
}
const lineMat = makeLineMat();
/* 動態物件用的局部輪廓 */
function localOutline(mesh, th = 25) {
  const eg = new THREE.EdgesGeometry(mesh.geometry, th);
  const g = new LineSegmentsGeometry().setPositions(eg.attributes.position.array);
  const l = new LineSegments2(g, lineMat);
  mesh.add(l); mesh.userData.ol = false;
  return l;
}

/* 柔光貼圖 */
const radialTex = canvasTex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,255,255,.55)');
  gr.addColorStop(.6, 'rgba(255,255,255,.14)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
function decal(x, z, sx, sz, color, k = 1, y = 0.03, rot = 0) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
    map: radialTex, color: new THREE.Color(color).multiplyScalar(k), transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  }));
  m.rotation.x = -Math.PI / 2; m.rotation.z = rot;
  m.scale.set(sx, sz, 1); m.position.set(x, y, z); m.renderOrder = 2;
  scene.add(m); return m;
}
function sprite(x, y, z, s, color, k = 1) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: radialTex, color: new THREE.Color(color).multiplyScalar(k), transparent: true,
    blending: THREE.AdditiveBlending, depthWrite: false, fog: false
  }));
  sp.position.set(x, y, z); sp.scale.set(s, s, 1);
  scene.add(sp); return sp;
}
/* 雨夜光柱 */
function lightCone(x, y, z, r, h, color, k = 0.12) {
  const geo = new THREE.ConeGeometry(r, h, 32, 1, true);
  const mat = new THREE.ShaderMaterial({
    uniforms: { uC: { value: new THREE.Color(color) }, uK: { value: k }, uH: { value: h } },
    vertexShader: `uniform float uH; varying float vH; varying vec3 vN; varying vec3 vV;
      void main(){ vH = position.y/uH + 0.5; vec4 mv = modelViewMatrix*vec4(position,1.);
      vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `uniform vec3 uC; uniform float uK; varying float vH; varying vec3 vN; varying vec3 vV;
      void main(){ float f = abs(dot(normalize(vN), normalize(vV))); float a = pow(vH, 1.6)*uK*f*f*(0.3+0.7*smoothstep(0.0,0.25,vH));
      gl_FragColor = vec4(uC*a, 1.0); }`,
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
  });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y - h / 2, z); scene.add(m); return m;
}

/* =========================================================
   1. 底座（收藏模型的木質台座）
   ========================================================= */
const S = 14; // 半邊長
boxR(-14.45, 14.45, -1.9, -0.5, -14.45, 14.45, toon(0x3a2a24), { th: 10 });
boxR(-14.55, 14.55, -0.53, -0.47, -14.55, 14.55, toon(0xc79a52));
boxR(-14.05, 14.05, -0.47, -0.012, -14.05, 14.05, toon(0x1f2236));
boxR(-14.6, 14.6, -2.0, -1.9, -14.6, 14.6, toon(0x241a17));
// 銘牌
{
  const t = canvasTex(1024, 128, (g, w, h) => {
    g.fillStyle = '#c79a52'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#6e5126'; g.lineWidth = 6; g.strokeRect(8, 8, w - 16, h - 16);
    g.fillStyle = '#3b2a12'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `bold 54px ${JP}`; g.fillText('雨夜の街角  ·  よるマート三丁目店', w / 2, 56);
    g.font = `26px ${JP}`; g.fillText('RAINY NIGHT CORNER — 1 / 150 SCALE', w / 2, 102);
  });
  plane(5.2, 0.65, toon(0xffffff, { map: t }), 0, -1.2, 14.456);
  plane(5.2, 0.65, toon(0xffffff, { map: t }), 14.456, -1.2, 0, Math.PI / 2);
}

/* =========================================================
   2. 地面：濕潤反射 + 半透明柏油層
   ========================================================= */
const puddles = [
  { x: 9.2, z: 8.6, r: 1.7 }, { x: 4.4, z: 10.1, r: 1.0 }, { x: 10.6, z: -4.5, r: 1.3 },
  { x: -3.6, z: 4.0, r: 1.15 }, { x: -8.6, z: -5.2, r: 0.85 }, { x: -1.2, z: 10.6, r: 1.4 },
  { x: -10.5, z: 8.4, r: 1.2 }, { x: 8.6, z: 2.2, r: 0.85 }, { x: -2.6, z: -11.0, r: 0.9 },
  { x: -12.2, z: 2.4, r: 0.9 }, { x: 11.2, z: -11.0, r: 1.0 }, { x: 0.6, z: 3.3, r: 0.7 }
];
const reflShader = {
  uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, uTime: { value: 0 } },
  vertexShader: `uniform mat4 textureMatrix; varying vec4 vUv; varying vec3 vW;
    void main(){ vUv = textureMatrix*vec4(position,1.0); vW = (modelMatrix*vec4(position,1.0)).xyz;
    gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 color; uniform sampler2D tDiffuse; uniform float uTime; varying vec4 vUv; varying vec3 vW;
    void main(){
      vec2 w = vW.xz;
      vec2 off = vec2(sin(w.y*3.1+uTime*1.7)+sin(w.x*7.3-uTime*2.3)*0.6,
                      cos(w.x*4.3+uTime*1.3)+sin(w.y*8.7+uTime*2.9)*0.6)*0.0016;
      vec3 acc = vec3(0.); float ws = 0.;
      for(int i=-2;i<9;i++){
        float fi = float(i); float wt = 1.0 - abs(fi-1.0)/10.0;
        vec4 uv = vUv; uv.xy += (off + vec2(0.0, fi*0.0042))*uv.w;
        acc += texture2DProj(tDiffuse, uv).rgb*wt; ws += wt;
      }
      gl_FragColor = vec4(acc/ws*color, 1.0);
      #include <colorspace_fragment>
    }`
};
const reflector = new Reflector(new THREE.PlaneGeometry(28, 28), {
  color: 0x9aa3c6, textureWidth: 1024, textureHeight: 1024, clipBias: 0.003, shader: reflShader
});
reflector.rotation.x = -Math.PI / 2;
reflector.position.y = 0.0;
scene.add(reflector);

// 柏油與標線（畫在一張大貼圖上）
const GS = 2048, PX = GS / 28;
const gx = x => (x + S) * PX, gz = z => (z + S) * PX;
function drawGround(g, alpha) {
  const R = (x0, x1, z0, z1, c) => { g.fillStyle = c; g.fillRect(gx(x0), gz(z0), (x1 - x0) * PX, (z1 - z0) * PX); };
  // 底
  R(-14, 14, -14, 14, alpha ? '#b8b8b8' : '#2a2e40');
  // 停車場略亮
  R(-14, 7, -14, 6.5, alpha ? '#c4c4c4' : '#2f3346');
  if (!alpha) { // 顆粒
    for (let i = 0; i < 26000; i++) {
      g.fillStyle = Math.random() < .5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.12)';
      g.fillRect(Math.random() * GS, Math.random() * GS, 2, 2);
    }
    // 修補痕
    g.fillStyle = 'rgba(15,17,28,.45)';
    g.fillRect(gx(8), gz(-9), 3 * PX, 1.6 * PX); g.fillRect(gx(-6), gz(8.4), 4 * PX, 1.2 * PX);
  }
  const paint = alpha ? '#e6e6e6' : 'rgba(232,236,246,.93)';
  const yellow = alpha ? '#e6e6e6' : 'rgba(240,196,70,.9)';
  // 斑馬線（橫越前方道路）
  for (let i = 0; i < 5; i++) R(1.6 + i * 0.9, 2.05 + i * 0.9, 6.95, 11.55, paint);
  // 斑馬線（橫越右側道路）
  for (let i = 0; i < 5; i++) R(7.45, 12.05, 1.15 + i * 0.9, 1.6 + i * 0.9, paint);
  // 停止線
  R(1.0, 1.25, 6.6, 9.2, paint); R(9.8, 12.45, 0.55, 0.8, paint);
  // 中央線
  for (let x = -14; x < 0.6; x += 2.2) R(x, x + 1.2, 9.18, 9.32, paint);
  for (let z = -14; z < 0.2; z += 2.2) R(9.68, 9.82, z, z + 1.2, paint);
  // 外側線
  R(-14, 1.0, 6.72, 6.84, paint); R(-14, 1.0, 11.66, 11.78, paint);
  R(7.16, 7.28, -14, 0.6, paint); R(12.22, 12.34, -14, 0.6, paint);
  // 菱形預告標記
  const diamond = (cx, cz, ax) => {
    g.strokeStyle = paint; g.lineWidth = .14 * PX; g.beginPath();
    if (ax) { g.moveTo(gx(cx - 1.2), gz(cz)); g.lineTo(gx(cx), gz(cz - .45)); g.lineTo(gx(cx + 1.2), gz(cz)); g.lineTo(gx(cx), gz(cz + .45)); }
    else { g.moveTo(gx(cx), gz(cz - 1.2)); g.lineTo(gx(cx + .45), gz(cz)); g.lineTo(gx(cx), gz(cz + 1.2)); g.lineTo(gx(cx - .45), gz(cz)); }
    g.closePath(); g.stroke();
  };
  diamond(-8, 7.95, true); diamond(11.1, -8, false);
  // 箭頭
  const arrow = (cx, cz, dir) => {
    g.save(); g.translate(gx(cx), gz(cz)); g.rotate(dir); g.fillStyle = paint;
    g.fillRect(-1.3 * PX, -.12 * PX, 1.6 * PX, .24 * PX);
    g.beginPath(); g.moveTo(.3 * PX, -.42 * PX); g.lineTo(1.05 * PX, 0); g.lineTo(.3 * PX, .42 * PX); g.closePath(); g.fill(); g.restore();
  };
  arrow(-3.5, 7.95, 0); arrow(11.1, -3.2, Math.PI / 2);
  // 停車格
  const stall = (x0, x1, z0, z1, n) => {
    g.strokeStyle = paint; g.lineWidth = .12 * PX;
    g.beginPath(); g.moveTo(gx(x0), gz(z1)); g.lineTo(gx(x0), gz(z0)); g.lineTo(gx(x1), gz(z0)); g.lineTo(gx(x1), gz(z1)); g.stroke();
    g.fillStyle = paint; g.font = `bold ${.8 * PX}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(n, gx((x0 + x1) / 2), gz(z0 + 0.9));
  };
  stall(-7.1, -4.3, 2.75, 6.1, '1'); stall(-4.3, -1.5, 2.75, 6.1, '2'); stall(-13.8, -11.0, -0.6, 4.4, '3');
  // 停車場與道路分界黃線
  R(-14, -1, 6.42, 6.52, yellow);
  // 小巷「止まれ」
  if (!alpha) {
    g.save(); g.translate(gx(-8.65), gz(-0.2)); g.fillStyle = paint; g.font = `bold ${0.95 * PX}px ${JP}`;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('止まれ', 0, 0); g.restore();
  }
  R(-10, -7.3, 0.55, 0.7, paint);
  // 人孔蓋
  const manhole = (x, z) => {
    g.fillStyle = alpha ? '#d6d6d6' : '#3b3e4e'; g.beginPath(); g.arc(gx(x), gz(z), .42 * PX, 0, Math.PI * 2); g.fill();
    if (!alpha) {
      g.strokeStyle = '#555a6e'; g.lineWidth = 2;
      for (let r = .1; r < .42; r += .1) { g.beginPath(); g.arc(gx(x), gz(z), r * PX, 0, Math.PI * 2); g.stroke(); }
    }
  };
  manhole(-6, 10.4); manhole(10.9, -1.5); manhole(-9.2, -9);
  // 排水溝格柵（沿路緣）
  const grate = (x0, x1, z0, z1) => {
    R(x0, x1, z0, z1, alpha ? '#f0f0f0' : '#16182a');
    if (!alpha) {
      g.fillStyle = '#5c6278';
      const along = (x1 - x0) > (z1 - z0);
      if (along) for (let x = x0; x < x1; x += .08) g.fillRect(gx(x), gz(z0), 2, (z1 - z0) * PX);
      else for (let z = z0; z < z1; z += .08) g.fillRect(gx(x0), gz(z), (x1 - x0) * PX, 2);
    }
  };
  grate(-14, -1, 6.52, 6.82); grate(7.0, 7.3, -14, 1.0); grate(-8.95, -8.35, -13.8, -1.2);
  // 積水
  for (const p of puddles) {
    const blobs = 5;
    for (let i = 0; i < blobs; i++) {
      const a = (i / blobs) * Math.PI * 2 + p.x;
      const ox = Math.cos(a) * p.r * .35, oz = Math.sin(a) * p.r * .25;
      const rad = p.r * (0.62 + 0.25 * Math.sin(i * 2.1 + p.z));
      const gr = g.createRadialGradient(gx(p.x + ox), gz(p.z + oz), 0, gx(p.x + ox), gz(p.z + oz), rad * PX);
      if (alpha) { gr.addColorStop(0, 'rgba(18,18,18,1)'); gr.addColorStop(.7, 'rgba(18,18,18,.9)'); gr.addColorStop(1, 'rgba(18,18,18,0)'); }
      else { gr.addColorStop(0, 'rgba(14,16,30,.9)'); gr.addColorStop(.75, 'rgba(14,16,30,.6)'); gr.addColorStop(1, 'rgba(14,16,30,0)'); }
      g.fillStyle = gr; g.beginPath(); g.arc(gx(p.x + ox), gz(p.z + oz), rad * PX, 0, Math.PI * 2); g.fill();

const glassMats = [];
function glassMat(w, h) {
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uSize: { value: new THREE.Vector2(w, h) }, uTint: { value: new THREE.Color(0.55, 0.74, 0.92) }, uBase: { value: 0.1 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `uniform float uTime; uniform vec2 uSize; uniform vec3 uTint; uniform float uBase; varying vec2 vUv;
      float h1(float n){ return fract(sin(n*127.1+3.7)*43758.5453); }
      float h2(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      void main(){
        vec2 p = vUv*uSize; float k = 0.0;
        float d = (p.x + p.y*0.7)/(uSize.x + uSize.y*0.7);
        k += 0.26*(1.0-smoothstep(0.0,0.025,abs(d-0.30))) + 0.18*(1.0-smoothstep(0.0,0.008,abs(d-0.345)));
        k += 0.16*(1.0-smoothstep(0.0,0.012,abs(d-0.74)));
        vec2 g = p/0.05; vec2 gi = floor(g); vec2 gf = fract(g)-0.5;
        float r = h2(gi);
        if(r>0.86){ vec2 o = vec2(h2(gi+1.3),h2(gi+7.1))-0.5; float dd = length(gf-o*0.5); k += 0.5*(1.0-smoothstep(0.1,0.2,dd)); }
        float cw = 0.085; float col = floor(p.x/cw); float fx = fract(p.x/cw)-0.5;
        float rc = h1(col);
        if(rc>0.45){
          float sp = 0.12+0.5*h1(col+11.0);
          float L = uSize.y+1.6;
          float head = uSize.y+0.3-mod(uTime*sp+rc*53.0, L);
          float dy = p.y-head;
          float wob = 0.16*sin(p.y*9.0+col*1.7);
          float dx = abs(fx-wob);
          float drop = 1.0-smoothstep(0.7,1.0,length(vec2(dx/0.24, dy/0.03)));
          float trail = (dy>0.0 && dy<1.0) ? (1.0-smoothstep(0.04,0.1,dx))*(1.0-dy)*0.42 : 0.0;
          k += drop*0.95 + trail;
        }
        k = clamp(k,0.0,1.0);
        gl_FragColor = vec4(mix(uTint, vec3(0.94,0.98,1.0), k), uBase + k*0.6);
      }`,
    transparent: true, depthWrite: false, side: THREE.DoubleSide
  });
  glassMats.push(m); return m;
}

  if (alleyNext <= 0) { alleyOn = !alleyOn; alleyNext = alleyOn ? rnd(0.6, 4) : rnd(0.04, 0.18); }
  const ak = alleyOn ? 1 : 0.12;
  alleyLampM.color.setRGB(0.85 * 2.2 * ak, 0.94 * 2.2 * ak, 2.2 * ak);
  alleyLight.intensity = 2.5 * ak; alleyDecal.material.color.setRGB(.75 * .5 * ak, .86 * .5 * ak, .5 * ak);
  backLampM.color.setRGB(1.8, 1.9, 2.0).multiplyScalar(0.92 + 0.08 * Math.sin(t * 7.0));

  // 交通號誌（週期 22 秒）
  const c = t % 22;
  const A = c < 8 ? 'g' : c < 10 ? 'y' : 'r';
  const B = (c >= 11 && c < 19) ? 'g' : (c >= 19 && c < 21) ? 'y' : 'r';
  setSignal(headA, A); setSignal(headB, B);
  sigDecalA.material.color.copy(sigGlowC[A]).multiplyScalar(0.22);
  sigDecalB.material.color.copy(sigGlowC[B]).multiplyScalar(0.22);
  const pedR1 = c < 6 ? 'walk' : c < 8 ? 'blink' : 'stop';
  const pedR2 = (c >= 11 && c < 17) ? 'walk' : (c >= 17 && c < 19) ? 'blink' : 'stop';
  setPed(pedA, pedR1, t); setPed(pedC, pedR1, t); setPed(pedB, pedR2, t); setPed(pedD, pedR2, t);

  // 蒸氣
  for (const s of steam) {
    s.t += dt * 0.35; if (s.t > 1) s.t -= 1;
    s.sp.position.set(2.45 + Math.sin(s.t * 6 + t) * 0.05, 1.28 + s.t * 0.9, -5.3);
    const sc = 0.15 + s.t * 0.35; s.sp.scale.set(sc, sc, 1);
    s.sp.material.opacity = Math.sin(s.t * Math.PI) * 0.22;
  }

  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}
animate();
</script>
